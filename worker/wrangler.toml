# Cloudflare Worker config for the qb-td backend.
# Setup steps: ../README.md
name = "qb-td"
main = "worker.js"
compatibility_date = "2026-07-01"

[[d1_databases]]
binding = "DB"
database_name = "qb-td"
database_id = "d57faef8-7c4b-45c6-9d13-7a7d9ca2d312"

[[r2_buckets]]
binding = "DATA"
bucket_name = "qb-td-data"

# The cron's per-tournament rebuild runs as its own invocation through a
# binding back to this Worker's Rebuild entrypoint (worker.js), so each
# rebuild gets its own CPU allowance instead of the tick paying for every
# dirty tournament at once. A named entrypoint is only reachable through a
# binding — never from the public URL. Self-hosting under another Worker
# name: change `service` to match `name` above. Without the binding the
# cron rebuilds inline, as it always did.
[[services]]
binding = "REBUILD"
service = "qb-td"
entrypoint = "Rebuild"

# The qb-td-live deploy (worker.js "public state on qb-td-live") runs as
# its own invocation through this binding, like the rebuilds above, so
# its Cloudflare API calls and R2 reads don't come out of the tick's 50
# subrequests. Self-hosting under another name: change `service` too.
[[services]]
binding = "LIVE"
service = "qb-td"
entrypoint = "LivePublish"

# Attempt cap on the buzzpoints password route (worker.js pubQPacket).
# Cloudflare's rate limiter needs no provisioning and costs nothing, but it
# counts per colo rather than globally. Period must be 10 or 60.
[[unsafe.bindings]]
name = "BUZZ_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Public-snapshot publisher (worker.js "public snapshots on GitHub"):
# publishes the public page's heavy blobs to a GitHub data repo every
# minute so viewers fetch them from raw.githubusercontent.com instead of
# this Worker. Apply migrate-pub.sql before enabling.
[triggers]
# The second trigger is the alerts' hourly wrap-up (worker.js ALERT_CRON);
# it does nothing unless DISCORD_WEBHOOK is set.
crons = ["* * * * *", "0 * * * *"]

[vars]
# Origin of the GitHub Pages site — used for CORS.
ALLOWED_ORIGIN = "https://qbsuite.github.io"

# Snapshot publisher config — leave SNAPSHOT_REPO empty to disable the
# whole feature (the cron then no-ops and /pub serves everything, exactly
# as before). Credential: either a GitHub App with contents:write on ONLY
# the data repo (fill the two ids below + `npx wrangler secret put
# GITHUB_APP_KEY` with the PKCS#8-converted private key), or a
# fine-grained PAT (`npx wrangler secret put GITHUB_TOKEN`). Setup steps:
# ../README.md ("Public snapshots on GitHub").
SNAPSHOT_REPO = "qbsuite/qb-td-live"
SNAPSHOT_BRANCH = "main"
GITHUB_APP_ID = "4565927"
GITHUB_INSTALLATION_ID = "153087044"

# Public state files (worker.js "public state on qb-td-live"): viewers
# read each published tournament's state from this files-only Worker
# instead of /pub/:slug. Leave LIVE_SCRIPT empty to turn it off. Needs
# migrate-live.sql and the LIVE_TOKEN secret (`npx wrangler secret put
# LIVE_TOKEN`: an ACCOUNT-owned API token with Individual Workers Editor
# on LIVE_SCRIPT only, no expiry). Setup: ../README.md ("Public state on
# qb-td-live").
LIVE_SCRIPT = "qb-td-live"
LIVE_ACCOUNT_ID = "905b6a6cd745425d70d3c4d9612ba2d8"

# New-activity alerts (worker.js "new-activity alerts"): a Discord webhook
# pinged when someone creates a tournament or set here, when a TD presses
# Start tournament, and with a summary once its links close. Optional — with the DISCORD_WEBHOOK secret
# unset the whole feature is dead code. To enable: Discord > Server
# Settings > Integrations > New Webhook, copy the URL, then
# `npx wrangler secret put DISCORD_WEBHOOK`. Apply migrate-alertmsg.sql
# first.

# The only secrets are the snapshot publisher's GitHub credential,
# LIVE_TOKEN (above) and DISCORD_WEBHOOK;
# all request access is via unguessable link secrets (see worker.js).

# Workers Logs, for counting how often the public page falls back to the Worker
# (pubState logs "live fallback <slug> <reason>"). Per-request invocation
# logs off: the Free plan's 200,000 events/day then hold only console
# output, almost all of it those fallbacks.
[observability]
enabled = true

[observability.logs]
invocation_logs = false
