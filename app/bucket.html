<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>qb-td</title>
<link rel="stylesheet" href="css/td.css">
<link rel="stylesheet" href="css/room.css">
</head>
<body>
<div class="bwrap">
  <header class="bhead">
    <div>
      <h1 id="tname">qb-td</h1>
      <span id="room"></span>
    </div>
    <a id="readerlink" href="#" hidden>Open the reader</a>
  </header>
  <div id="msg"></div>

  <section class="bsec" id="roundcard" hidden>
    <div class="bsechead">
      <h2>Packets</h2>
      <span class="muted"><span id="curround"></span> · <span id="closes"></span></span>
    </div>
    <div class="bchips" id="rounds"></div>
    <div id="nopacket" class="muted" style="padding-top:12px" hidden>No packet yet</div>
  </section>

  <div id="uparea" class="bstack">
    <section class="bsec">
      <div class="bsechead">
        <h2>Upload a game</h2>
        <label>Round <input id="upround" type="number" min="1" max="999"></label>
      </div>
      <label class="drop" id="drop">
        <span>Drop the .qbj and the MODAQ game file</span>
        <span class="muted">or <span style="color:var(--link)">choose files</span></span>
        <span class="picked" id="picked"></span>
        <input id="upfiles" type="file" multiple accept=".qbj,.json">
      </label>
      <div class="uprow"><button id="upbtn" class="primary">Upload</button></div>
    </section>

    <section class="bsec">
      <div class="bsechead"><h2>This room&rsquo;s uploads</h2></div>
      <div id="uploads" class="ulist"></div>
    </section>
  </div>
</div>
<script type="module">
import { pub, esc, fmtBytes } from './js/api.js';
import { slotLabel } from './engine/brackets.js';

const $ = (id) => document.getElementById(id);
const secret = new URLSearchParams(location.search).get('b') || '';
let state = null;
let closed = false;
let schedGame = null; // brackets only: this room's game on its round, {a, b}
let schedGameRound = 0;
// worker.js NOT_STARTED: every room route answers this until the TD presses Start
const NOT_STARTED = "Tournament hasn't started";

function say(text, bad = false) {
  $('msg').textContent = text || '';
  $('msg').className = bad ? 'bad' : '';
}

function render() {
  document.title = state.tournament + ' - ' + state.room;
  $('tname').textContent = state.tournament;
  $('room').textContent = state.room;
  $('roundcard').hidden = false;
  $('readerlink').hidden = false;
  $('curround').textContent = 'Now on round ' + state.current_round;
  // brackets that keep their own rounds: which one this room is in, and its game
  if (state.bracket) {
    $('curround').insertAdjacentHTML('beforeend', ` &middot; <span class="bname"><i class="lane-${Number(state.bracket.color) || 0}"></i>${
      esc(state.bracket.name)}</span>${schedGame ? ` &middot; ${esc(schedGame.a)} vs ${esc(schedGame.b)}` : ''}`);
  }
  $('closes').textContent = 'open until ' + new Date(state.closes).toLocaleString([], {
    month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const packets = state.packets || (state.packet ? [state.packet] : []);
  $('rounds').innerHTML = packets.map((p) =>
    `<a href="#" class="${p.number === state.current_round ? 'on' : ''}" data-round="${p.number}"
      title="${esc(p.packet_name)}">Round ${p.number}</a>`).join('');
  $('nopacket').hidden = !!packets.length;
  if (!$('upround').value) $('upround').value = state.current_round;
  const extra = state.upload_count > state.uploads.length
    ? `<div class="muted" style="margin-top:8px;font-size:13px">Latest ${state.uploads.length} of ${state.upload_count}</div>` : '';
  $('uploads').innerHTML = (state.uploads.length ? state.uploads.map((u) => `<div class="u">
      <span class="muted">Round ${u.round}</span>
      <span class="brk">${esc(u.filename)}</span>
      <span class="num">${fmtBytes(u.size)}</span>
      <span class="st ${u.error ? 'bad' : 'ok'}" title="${u.error ? 'Error' : 'Uploaded'}">${u.error ? '!' : '&#10003;'}</span>
      ${u.error ? `<span class="err">${esc(u.error)}</span>` : ''}
    </div>`).join('') : '<div class="none">None yet</div>') + extra;
}

// Before Start the room serves nothing, so nothing to show but the wait.
function showNotStarted() {
  $('roundcard').hidden = true;
  $('uparea').hidden = true;
  say(NOT_STARTED + '. Reload this page once the TD starts it.', true);
}

function showClosed() {
  closed = true;
  $('roundcard').hidden = true;
  $('uparea').hidden = true;
  say('room closed', true);
}

// The game the schedule has this room playing in round n (placeholders
// read "Pool A 1st" until the playoffs are filled), or null.
async function roomGame(n) {
  try {
    const sr = await pub('/b/' + secret + '/schedule');
    if (!sr || sr.room === null || !sr.schedule) return null;
    for (const ph of sr.schedule.phases) for (const r of ph.rounds) {
      if (r.round !== n) continue;
      const g = r.games.find((x) => x.room === sr.room);
      return g && g.a && g.b ? { a: slotLabel(g.a), b: slotLabel(g.b) } : null;
    }
  } catch (e) { /* no schedule: the round and bracket alone */ }
  return null;
}

async function refresh() {
  if (closed) return;
  try {
    state = await pub('/b/' + secret);
    // fetched once per round the room reaches, not on every refresh
    if (!state.bracket) { schedGame = null; schedGameRound = 0; }
    else if (schedGameRound !== state.current_round) {
      schedGame = await roomGame(state.current_round);
      schedGameRound = state.current_round;
    }
    render();
  } catch (e) {
    if (e.message === 'room closed') showClosed();
    else if (e.message === NOT_STARTED) showNotStarted();
    else say(e.message, true);
  }
}

$('rounds').onclick = async (e) => {
  const round = Number(e.target.dataset && e.target.dataset.round);
  if (!round) return;
  e.preventDefault();
  try {
    const res = await pub('/b/' + secret + '/packet?round=' + round);
    // pub() parses JSON-typed blobs (e.g. .json packets); rewrap for download
    const blob = res instanceof Response
      ? await res.blob()
      : new Blob([JSON.stringify(res)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = e.target.title || 'packet';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e2) { say(e2.message, true); }
};

$('upbtn').onclick = async () => {
  const files = [...$('upfiles').files];
  if (!files.length) { say('Choose files', true); return; }
  const round = Number($('upround').value);
  $('upbtn').disabled = true;
  try {
    for (const f of files) {
      say('uploading ' + f.name);
      const out = await pub(`/b/${secret}/upload?round=${round}&name=${encodeURIComponent(f.name)}`,
        { method: 'POST', body: f });
      if (out.error) say(f.name + ': ' + out.error, true);
    }
    say('Uploaded');
    $('upfiles').value = '';
    showPicked();
    await refresh();
  } catch (e) {
    if (e.message === 'room closed') showClosed();
    else if (e.message === NOT_STARTED) showNotStarted();
    else say(e.message, true);
  }
  $('upbtn').disabled = false;
};

// drop zone: dropped files land in the same input the picker fills
function showPicked() {
  const files = [...$('upfiles').files];
  $('picked').textContent = files.map((f) => f.name).join(', ');
}
$('upfiles').onchange = showPicked;
$('drop').ondragover = (e) => { e.preventDefault(); $('drop').classList.add('dragover'); };
$('drop').ondragleave = () => $('drop').classList.remove('dragover');
$('drop').ondrop = (e) => {
  e.preventDefault();
  $('drop').classList.remove('dragover');
  if (!e.dataTransfer.files.length) return;
  $('upfiles').files = e.dataTransfer.files;
  showPicked();
};

if (!secret) say('bad link', true);
else {
  $('readerlink').href = 'read.html?b=' + encodeURIComponent(secret);
  refresh();
  // No timer. This page refreshes when it loads, when the mod comes back
  // to the tab, and after every upload — all demand-driven, so a room
  // costs requests only when someone is actually looking. A 60s poll here
  // was the single largest line item at scale (240 live rooms would have
  // spent the whole daily budget on it).
  //
  // Focus refresh stays, unlike on the public page: a moderator must not
  // miss the TD advancing the round, and returning to the tab is exactly
  // when that matters. It fires per human glance, not per minute.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refresh();
  });
}
</script>
</body>
</html>
